<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Editor</title>
	<meta name="description" content="An online HTML editor which helps you to clean up your HTML code">
	<link rel="icon" href="./dist/img/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="./dist/bundle.css">
</head>

<body>
	<main>
		<section id="html">
			<div id="wysiwyg"></div>
		</section>
		<div id="divider"></div>
		<section id="code">
			<div class="tabs">
				<input type="radio" name="lang" value="html" id="lang-html" checked>
				<label for="lang-html">HTML</label>
				<input type="radio" name="lang" value="markdown" id="lang-markdown">
				<label for="lang-markdown">Markdown</label>
				<div class="toggle">
					<input type="checkbox" name="entity" id="entity">
					<label for="entity">HTML entity</label>
				</div>
				<div class="toggle">
					<input type="checkbox" name="spell" id="spell">
					<label for="spell">Spell check</label>
				</div>
			</div>
			<div id="editor"></div>
		</section>
	</main>
	<script src="./dist/bundle.js"></script>
</body>

</html>
